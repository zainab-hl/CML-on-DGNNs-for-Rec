[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-mgat"
version = "0.6.0"
description = "Heterogeneous, multi-modal GAT recommender with EWC and severity-based architectural growth for continual learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name" },
]
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.4",
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lgcn-cl"
version = "0.1.0"
description = "Continual Learning LightGCN with EWC and severity-based adaptive growth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torch-sparse",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.scripts]
lgcn-train = "lgcn_cl.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
